[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-cinema"
version = "0.0.1"
description = "Federated Learning with Flower for fundational model cineMA"
# license = ""
readme = "README.md"
dependencies = [
    # Core PyTorch & Deep Learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",

    # Medical Imaging
    "monai>=1.3.0",
    "nibabel>=4.0.0",
    "scikit-image>=0.21.0",

    # Vision & Model Architectures
    "timm>=0.9.0",
    "transformers>=4.35.0",
    "huggingface-hub>=0.19.0",

    # Data Processing & ML
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",

    # Configuration & Logging
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "wandb>=0.15.0",

    # Federated Learning & Parameter Efficiency
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "peft>=0.7.0",

    # Utilities
    "tqdm>=4.66.0",
    "tensorboard>=2.14.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "einops>=0.6.0",
    "simpleitk>=2.3.0",
    "zstandard>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
]

[project.scripts]
centralized_train = "flwr_cinema.centralized.combined.train:main"
centralized_eval = "flwr_cinema.centralized.combined.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flwr_cinema"]

[tool.flwr.app]
publisher = "Rodo1204"

[tool.flwr.app.components]
serverapp = "flwr_cinema.server_app:app"
clientapp = "flwr_cinema.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 0.5
local-epochs = 1
learning-rate = 0.1
batch-size = 32
hydra_config_dir = "../../../configs"
hydra_config_name = "cinema_classification_fed_mypc"

[superlink.local]
options.num-supernodes = 2